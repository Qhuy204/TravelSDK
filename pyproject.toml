[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-sdk"
version = "0.1.1"
description = "Unified Python SDK for Vietnam Transportation (Flight, Train, Bus). Enriched data for RAG & AI Agents."
authors = [
    {name = "Qhuy204"},
]
license = "MIT"
readme = "README.md"
keywords = ["travel", "vietnam", "sdk", "flight", "train", "bus", "vnr", "vexere"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
travel-sdk = "travel.cli:main"

[tool.setuptools.packages.find]
include = ["travel*"]
exclude = ["scratch*", "tests*", "examples*"]

[tool.setuptools.package-data]
travel = ["data/*.json"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "python-dotenv>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
